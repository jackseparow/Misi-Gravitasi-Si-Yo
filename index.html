<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Si Yo: Simulator Gravitasi Tata Surya</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0b0d17; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 5px; 
            margin: 0; 
            overflow-x: hidden; 
            min-height: 100vh;
        }
        
        #title-container { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 10px; 
            background: rgba(255, 255, 255, 0.1); 
            padding: 10px; 
            border-radius: 12px; 
            width: 98%; 
            max-width: 1200px; 
            border: 1px solid rgba(255,255,255,0.2);
            box-sizing: border-box;
        }
        .maskot { height: 50px; width: auto; }
        h2 { margin: 0; color: #4cc9f0; font-size: 0.9em; }
        .sub-h2 { color: #f1c40f; margin: 2px 0 0 0; font-weight: bold; font-size: 0.7em; }

        /* --- Layout Utama: Dipaksa Tetap Berjajar --- */
        #main-wrapper { 
            display: flex; 
            flex-direction: row; /* Tetap berjajar horizontal */
            gap: 5px; 
            width: 100%; 
            max-width: 1350px; 
            height: 80vh; 
            align-items: stretch;
            box-sizing: border-box;
        }

        /* --- Area Kiri: Lokasi (Dipersempit) --- */
        #planet-palette { 
            width: 25%; /* Mempersempit lebar area lokasi */
            background: rgba(255,255,255,0.1); 
            padding: 5px; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            overflow-y: auto; 
            border-left: 2px solid #f1c40f;
            flex-shrink: 0;
        }

        /* --- Area Tengah: Simulasi (Dipersempit) --- */
        #sim-area { 
            flex: 1; /* Fleksibel namun mengisi ruang tengah */
            background: linear-gradient(#0b0d17, #1a1c2c); 
            border-radius: 8px; 
            position: relative; 
            border: 2px solid #4cc9f0; 
            overflow: hidden; 
        }

        /* --- Area Kanan: Variabel (Dipersempit) --- */
        #controls { 
            width: 25%; /* Mempersempit lebar area variabel */
            background: rgba(255,255,255,0.1); 
            padding: 8px; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            border-right: 2px solid #4cc9f0;
            flex-shrink: 0;
        }

        /* Penyesuaian Komponen di Dalam Area yang Sempit */
        .planet-btn { 
            padding: 6px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            background: #222; 
            color: white; 
            display: flex; 
            align-items: center; 
            font-size: 0.65em; /* Font diperkecil agar muat */
        }
        .symbol { font-size: 1.1em; width: 15px; margin-right: 2px; }
        
        #timer-display { position: absolute; top: 10px; right: 10px; font-size: 1.2em; color: #f1c40f; }
        #rock { 
            position: absolute; left: 50%; transform: translateX(-50%); 
            width: 30px; height: 30px; /* Ukuran batu disesuaikan */
            background: radial-gradient(#aaa, #444); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 8px; border: 1px solid #666; 
        }

        .input-group label { font-size: 0.6em; }
        input { padding: 4px; font-size: 0.7em; background: #1a1c2c; color: white; border: 1px solid #444; width: 100%; border-radius: 4px; }

        .info-box { padding: 5px; background: rgba(76, 201, 240, 0.15); border-radius: 5px; font-size: 0.6em; }
        button#btn-main { background: #4cc9f0; color: #000; padding: 8px; border-radius: 5px; border: none; font-weight: bold; font-size: 0.7em; cursor: pointer; }
        
        #ground { position: absolute; bottom: 0; width: 100%; height: 15px; background: #333; }
        
        /* Hilangkan h3 pada mobile agar tidak makan tempat */
        @media (max-width: 600px) {
            h3 { display: none; }
        }
    </style>
</head>
<body>

    <div id="title-container">
        <img src="maskot-siyo.png" alt="Si Yo" class="maskot">
        <div id="title-text-area">
            <h2>Si Yo: Gravitasi</h2>
            <p class="sub-h2">Taman Numerasi BBGTK DIY</p>
        </div>
    </div>

    <div id="main-wrapper">
        <div id="planet-palette">
            <h3 style="margin: 0; color: #f1c40f; font-size: 0.7em; text-align: center;">Lokasi</h3>
            <button class="planet-btn" onclick="selectPlanet('Merkurius', 3.7, '#1e1e1e', '#95a5a6')"><span class="symbol">☿</span> Mer</button>
            <button class="planet-btn" onclick="selectPlanet('Venus', 8.87, '#3d2b1f', '#e67e22')"><span class="symbol">♀</span> Ven</button>
            <button class="planet-btn active" onclick="selectPlanet('Bumi', 9.8, '#1a1c2c', '#3498db')"><span class="symbol">♁</span> Bumi</button>
            <button class="planet-btn" onclick="selectPlanet('Bulan', 1.62, '#222', '#888')"><span class="symbol">☾</span> Bul</button>
            <button class="planet-btn" onclick="selectPlanet('Mars', 3.71, '#2c1a1a', '#c0392b')"><span class="symbol">♂</span> Mars</button>
            <button class="planet-btn" onclick="selectPlanet('Jupiter', 24.79, '#2c251a', '#f39c12')"><span class="symbol">♃</span> Jup</button>
            <button class="planet-btn" onclick="selectPlanet('Saturnus', 10.44, '#2c2c1a', '#f1c40f')"><span class="symbol">♄</span> Sat</button>
            <button class="planet-btn" onclick="selectPlanet('Uranus', 8.69, '#1a2c2c', '#1abc9c')"><span class="symbol">♅</span> Ura</button>
            <button class="planet-btn" onclick="selectPlanet('Neptunus', 11.15, '#0b132b', '#3f37c9')"><span class="symbol">♆</span> Nep</button>
            <button class="planet-btn" onclick="selectPlanet('Pluto', 0.62, '#0f0f1a', '#34495e')"><span class="symbol">♇</span> Plu</button>
        </div>

        <div id="sim-area">
            <div id="timer-display">0.00s</div>
            <div id="rock">5kg</div>
            <div id="ground"></div>
        </div>

        <div id="controls">
            <h3 style="margin: 0; color: #4cc9f0; font-size: 0.7em; text-align: center;">Var</h3>
            <div class="input-group">
                <label>H (m):</label>
                <input type="number" id="input-height" value="100" onchange="initPos()">
            </div>
            <div class="input-group">
                <label>M (kg):</label>
                <input type="number" id="input-mass" value="5" oninput="updateMass()">
            </div>
            <div class="info-box">
                <span id="lbl-planet">Bumi</span>: <span id="lbl-g">9.8</span>
            </div>
            <button id="btn-main" onclick="startFall()">GO!</button>
            <button onclick="initPos()" style="background:transparent; color: #e74c3c; border: 1px solid #e74c3c; padding: 4px; border-radius: 4px; cursor: pointer; font-size: 0.6em;">RESET</button>
        </div>
    </div>

    <script>
        let currentG = 9.8;
        let isFalling = false;
        let startTime;
        let animationId;
        const rock = document.getElementById('rock');
        const timerDisplay = document.getElementById('timer-display');

        function updateMass() {
            rock.innerText = document.getElementById('input-mass').value + "kg";
        }

        function selectPlanet(name, g, bg, groundCol) {
            if(isFalling) return;
            currentG = g;
            document.getElementById('lbl-planet').innerText = name;
            document.getElementById('lbl-g').innerText = g;
            document.getElementById('sim-area').style.background = `linear-gradient(${bg}, #000)`;
            document.getElementById('ground').style.background = groundCol;
            document.querySelectorAll('.planet-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            initPos();
        }

        function initPos() {
            isFalling = false;
            cancelAnimationFrame(animationId);
            rock.style.bottom = "calc(15px + 80%)"; 
            timerDisplay.innerText = "0.00s";
        }

        function startFall() {
            if(isFalling) return;
            isFalling = true;
            startTime = performance.now();
            animate();
        }

        function animate() {
            const now = performance.now();
            const t = (now - startTime) / 1000;
            const distanceFallen = 0.5 * currentG * (t * t);
            const totalHeight = document.getElementById('input-height').value;
            const remainingHeight = totalHeight - distanceFallen;
            const percentage = (remainingHeight / totalHeight) * 80;

            if (remainingHeight <= 0) {
                rock.style.bottom = "15px";
                timerDisplay.innerText = Math.sqrt((2 * totalHeight) / currentG).toFixed(2) + "s";
                isFalling = false;
                return;
            }

            rock.style.bottom = `calc(15px + ${percentage}%)`;
            timerDisplay.innerText = t.toFixed(2) + "s";
            animationId = requestAnimationFrame(animate);
        }

        initPos();
        updateMass();
    </script>
</body>
</html>
