<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Si Yo: Simulator Gravitasi Tata Surya</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0d17; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; overflow-x: hidden; }
        
        /* Title Area */
        #title-container { 
            display: flex; align-items: center; gap: 20px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.1); 
            padding: 15px 30px; border-radius: 15px; width: 100%; max-width: 1200px; border: 1px solid rgba(255,255,255,0.2);
        }
        .maskot { height: 100px; width: auto; }
        h2 { margin: 0; color: #4cc9f0; }
        .sub-h2 { color: #f1c40f; margin: 5px 0 0 0; font-weight: bold; }

        #main-wrapper { display: flex; gap: 20px; width: 100%; max-width: 1200px; height: 650px; }

        /* Kiri: Kontrol Variabel */
        #controls { width: 250px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input { padding: 8px; border-radius: 5px; border: none; background: #1a1c2c; color: white; border: 1px solid #444; }

        /* Tengah: Area Simulasi Jatuh */
        #sim-area { flex-grow: 1; background: linear-gradient(#0b0d17, #1a1c2c); border-radius: 12px; position: relative; border: 2px solid #4cc9f0; overflow: hidden; }
        #ground { position: absolute; bottom: 0; width: 100%; height: 20px; background: #333; transition: background 0.5s; }
        #rock { position: absolute; left: 50%; transform: translateX(-50%); width: 45px; height: 45px; background: radial-gradient(#aaa, #444); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border: 2px solid #666; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        #timer-display { position: absolute; top: 20px; right: 20px; font-family: monospace; font-size: 2.2em; color: #f1c40f; text-shadow: 2px 2px 4px black; }

        /* Kanan: Palet Planet */
        #planet-palette { width: 220px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 5px; }
        .planet-btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.3s; background: #222; color: white; display: flex; align-items: center; justify-content: space-between; font-size: 0.9em; }
        .planet-btn:hover { background: #444; transform: scale(1.03); }
        .planet-btn.active { background: #4cc9f0; color: #000; font-weight: bold; }
        .g-val { font-size: 0.8em; opacity: 0.8; }

        .info-box { margin-top: 10px; padding: 12px; background: rgba(76, 201, 240, 0.2); border-radius: 8px; font-size: 0.9em; border-left: 4px solid #4cc9f0; }
        button#btn-main { background: #4cc9f0; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1.1em; }
    </style>
</head>
<body>

    <div id="title-container">
        <img src="maskot-siyo.png" alt="Si Yo" class="maskot">
        <div id="title-text-area">
            <h2>🛡️ Si Yo: Simulator Gravitasi Tata Surya</h2>
            <p class="sub-h2">Taman Numerasi BBGTK D.I. Yogyakarta</p>
        </div>
    </div>

    <div id="main-wrapper">
        <div id="controls">
            <h3>Variabel</h3>
            <div class="input-group">
                <label>Tinggi Jatuh (m):</label>
                <input type="number" id="input-height" value="100" onchange="initPos()">
            </div>
            <div class="input-group">
                <label>Massa Batu (kg):</label>
                <input type="number" id="input-mass" value="5" oninput="updateMass()">
            </div>
            <div class="info-box">
                <b>Lokasi:</b> <span id="lbl-planet">Bumi</span><br>
                <b>Gravitasi:</b> <span id="lbl-g">9.8</span> $m/s^2$
            </div>
            <button id="btn-main" onclick="startFall()">JATUHKAN!</button>
            <button onclick="initPos()" style="background:transparent; color: #e74c3c; border: 1px solid #e74c3c; padding: 10px; border-radius: 8px; cursor: pointer; margin-top: 10px;">RESET</button>
        </div>

        <div id="sim-area">
            <div id="timer-display">0.00s</div>
            <div id="rock">5kg</div>
            <div id="ground"></div>
        </div>

        <div id="planet-palette">
            <h4 style="margin: 0 0 10px 0; text-align: center;">Pilih Lokasi</h4>
            <button class="planet-btn" onclick="selectPlanet('Merkurius', 3.7, '#1e1e1e', '#95a5a6')">🪐 Merkurius <span class="g-val">3.7</span></button>
            <button class="planet-btn" onclick="selectPlanet('Venus', 8.87, '#3d2b1f', '#e67e22')">☁️ Venus <span class="g-val">8.9</span></button>
            <button class="planet-btn active" onclick="selectPlanet('Bumi', 9.8, '#1a1c2c', '#3498db')">🌍 Bumi <span class="g-val">9.8</span></button>
            <button class="planet-btn" onclick="selectPlanet('Bulan', 1.62, '#222', '#888')">🌑 Bulan <span class="g-val">1.6</span></button>
            <button class="planet-btn" onclick="selectPlanet('Mars', 3.71, '#2c1a1a', '#c0392b')">🔴 Mars <span class="g-val">3.7</span></button>
            <button class="planet-btn" onclick="selectPlanet('Jupiter', 24.79, '#2c251a', '#f39c12')">🟠 Jupiter <span class="g-val">24.8</span></button>
            <button class="planet-btn" onclick="selectPlanet('Saturnus', 10.44, '#2c2c1a', '#f1c40f')">🟡 Saturnus <span class="g-val">10.4</span></button>
            <button class="planet-btn" onclick="selectPlanet('Uranus', 8.69, '#1a2c2c', '#1abc9c')">💎 Uranus <span class="g-val">8.7</span></button>
            <button class="planet-btn" onclick="selectPlanet('Pluto', 0.62, '#0f0f1a', '#34495e')">❄️ Pluto <span class="g-val">0.6</span></button>
        </div>
    </div>

    <script>
        let currentG = 9.8;
        let isFalling = false;
        let startTime;
        let animationId;
        const rock = document.getElementById('rock');
        const timerDisplay = document.getElementById('timer-display');

        function updateMass() {
            rock.innerText = document.getElementById('input-mass').value + "kg";
        }

        function selectPlanet(name, g, bg, groundCol) {
            if(isFalling) return;
            currentG = g;
            document.getElementById('lbl-planet').innerText = name;
            document.getElementById('lbl-g').innerText = g;
            document.getElementById('sim-area').style.background = `linear-gradient(${bg}, #000)`;
            document.getElementById('ground').style.background = groundCol;
            document.querySelectorAll('.planet-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            initPos();
        }

        function initPos() {
            isFalling = false;
            cancelAnimationFrame(animationId);
            rock.style.bottom = "calc(20px + 80%)"; 
            timerDisplay.innerText = "0.00s";
        }

        function startFall() {
            if(isFalling) return;
            isFalling = true;
            startTime = performance.now();
            animate();
        }

        function animate() {
            const now = performance.now();
            const t = (now - startTime) / 1000;
            const distanceFallen = 0.5 * currentG * (t * t);
            const totalHeight = document.getElementById('input-height').value;
            const remainingHeight = totalHeight - distanceFallen;
            const percentage = (remainingHeight / totalHeight) * 80;

            if (remainingHeight <= 0) {
                rock.style.bottom = "20px";
                timerDisplay.innerText = Math.sqrt((2 * totalHeight) / currentG).toFixed(2) + "s";
                isFalling = false;
                return;
            }

            rock.style.bottom = `calc(20px + ${percentage}%)`;
            timerDisplay.innerText = t.toFixed(2) + "s";
            animationId = requestAnimationFrame(animate);
        }

        initPos();
        updateMass();
    </script>
</body>
</html>
